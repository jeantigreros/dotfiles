[bar.default]
center = [ "media" ]
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "control-center", "clock", "session" ]
margin_ends = 400
start = [ "launcher", "wallpaper", "workspaces", "toggle" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@FALLBACK", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-2"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "FALLBACK"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = []

[shell]
font_family = "JetBrainsMono Nerd Font"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/j/Pictures/Wallpapers"
fill_mode = "stretch"

    [wallpaper.default]
    path = "/home/j/Pictures/Wallpapers/ardz5g17os451.jpg"

    [wallpaper.last]
    path = "/home/j/Pictures/Wallpapers/ardz5g17os451.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/j/Pictures/Wallpapers/ardz5g17os451.jpg"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/j/Pictures/Wallpapers/ardz5g17os451.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

[widget.bluetooth]
enabled = false

[widget.control-center]
enabled = false

[widget.launcher]
enabled = false

[widget.network]
enabled = false

[widget.toggle]
type = "maddingo/hypr-layout-switcher:toggle"

[widget.wallpaper]
enabled = false

[widget.workspaces]
style = "minimal"
